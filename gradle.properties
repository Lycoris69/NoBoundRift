# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35

# Kotlin
kotlin.code.style=official

# Compose compiler — required when using the standalone compose plugin (Kotlin 2.x)
# No extra flags needed; the plugin wires the compiler extension automatically.

# Gradle configuration cache (speeds up build script evaluation)
org.gradle.configuration-cache=true
org.gradle.caching=true
